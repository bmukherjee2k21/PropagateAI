<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CompuKids | Networking Notes, Class 12 CS</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ec;--card:#fff;--ink:#23224a;--mute:#5d5b86;--line:#e7dcc6;--pur:#6c3df4;--pink:#ff4d8d;--yel:#ffc928;--grn:#12b886;--blu:#2f9bff;--ora:#ff7a3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17163a;--card:#222152;--ink:#f4f1ff;--mute:#b4b1e0;--line:#38367a}}
:root[data-theme="dark"]{--bg:#17163a;--card:#222152;--ink:#f4f1ff;--mute:#b4b1e0;--line:#38367a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Nunito,system-ui,sans-serif}
h1,h2,h3{font-family:'Baloo 2',Nunito,system-ui,sans-serif;margin:0;line-height:1.15}
.banner{background:linear-gradient(120deg,var(--pur),var(--pink) 60%,var(--ora));color:#fff;padding:22px 16px 26px;text-align:center;position:relative;overflow:hidden}
.logo{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:34px;letter-spacing:.5px}
.logo span{display:inline-block;padding:0 8px;border-radius:12px;margin:0 1px;color:var(--ink)}
.logo .a{background:var(--yel)}.logo .b{background:#fff}
.tag{font-weight:800;margin:4px 0 0;opacity:.95}
.pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.pill{background:rgba(255,255,255,.22);padding:4px 12px;border-radius:99px;font-weight:700;font-size:14px}
.theme{position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top,0px));background:rgba(255,255,255,.25);border:0;color:#fff;border-radius:99px;padding:6px 12px;font:700 13px Nunito;cursor:pointer}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;padding:10px 12px;overflow-x:auto;border-bottom:3px dashed var(--line)}
nav button{flex:none;border:0;border-radius:14px;padding:9px 16px;font:800 15px 'Baloo 2',Nunito,sans-serif;cursor:pointer;color:#fff;opacity:.55;transition:.15s}
nav button.on{opacity:1;transform:translateY(-2px);box-shadow:0 4px 0 rgba(0,0,0,.25)}
nav button:focus-visible,.chip:focus-visible,.q:focus-visible,.ac:focus-visible,input:focus-visible{outline:3px solid var(--blu);outline-offset:2px}
main{max-width:980px;margin:0 auto;padding:16px 12px 40px}
.sec{display:none}.sec.on{display:block}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;align-items:center}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 14px;font:700 14px Nunito;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--card);border-radius:18px;border:2px solid var(--line);border-left:10px solid var(--c);overflow:hidden}
.card button.q{all:unset;box-sizing:border-box;width:100%;padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font:800 17px 'Baloo 2',Nunito,sans-serif}
.card .t{font:700 12px Nunito;background:var(--c);color:#fff;border-radius:99px;padding:1px 9px;white-space:nowrap;align-self:flex-start}
.card .body{display:none;padding:0 14px 14px;color:var(--ink)}
.card.open .body{display:block}
.card ul{margin:6px 0 0;padding-left:18px}
.key{background:color-mix(in srgb,var(--c) 18%,transparent);border-radius:8px;padding:6px 10px;margin-top:8px;font-weight:700;font-size:14px}
.note{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px;border-top:8px solid var(--c)}
.note h3{color:var(--c);margin-bottom:6px}
.note ul{margin:0;padding-left:20px}.note li{margin:3px 0}
.tbl{overflow-x:auto;border-radius:16px;border:2px solid var(--line);background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:480px}
th{background:var(--c);color:#fff;font:800 16px 'Baloo 2',Nunito,sans-serif;text-align:left;padding:9px 12px}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
td:first-child{font-weight:800;width:26%;background:color-mix(in srgb,var(--c) 12%,transparent)}
.srch{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input{flex:1;min-width:180px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;font:600 16px Nunito}
.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ac{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:2px solid var(--line);border-bottom:6px solid var(--c);border-radius:14px;padding:10px 12px}
.ac b{display:block;font:800 22px 'Baloo 2',sans-serif;color:var(--c)}
.ac span{font-size:14px}
.hide .ac span{visibility:hidden}.hide .ac.show span{visibility:visible}
.tip{color:var(--mute);font-size:14px;margin:0 0 12px}
footer{text-align:center;color:var(--mute);padding:16px;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="banner">
  <button class="theme" id="th" aria-label="Toggle dark mode">Dark / Light</button>
  <div class="logo"><span class="a">Compu</span><span class="b">Kids</span></div>
  <h1 style="font-size:26px;margin-top:6px">Computer Networks: Class 12 CS Notes</h1>
  <p class="tag">CBSE · Chapter 1 and Chapter 2 · Tap, flip and revise</p>
  <div class="pills"><span class="pill">Ch 1: Networks, media, devices</span><span class="pill">Ch 2: Topologies, protocols, web</span></div>
</header>
<nav id="nav"></nav>
<main>
  <section class="sec" id="s0"></section>
  <section class="sec" id="s1"></section>
  <section class="sec" id="s2"></section>
  <section class="sec" id="s3"></section>
</main>
<footer>Made with love by CompuKids. Keep learning, keep connecting.</footer>
<script>
const COL=['#6c3df4','#ff4d8d','#12b886','#2f9bff','#ff7a3d','#d6a000'];
// ch: 1 or 2
const comps=[
[1,'Network & Node','Basics','A network is a set of interconnected computers and devices sharing data and resources. Each device on it is a node (host, workstation, server, printer, router).',['Benefits: resource sharing, communication, cost saving, reliability','Goal: exchange data using a common set of rules (protocols)'],'Node = any device attached to a network.'],
[1,'Client & Server','Basics','A server provides services or resources; a client requests them. One machine can be both in a peer-to-peer network.',['Web server serves pages, file server stores files','Client example: your browser']],
[1,'Evolution of Networking','Basics','ARPANET (1969, US DoD) was the first packet-switched network. NSFNET linked universities in the 1980s. The Internet grew from joining many such networks (inter-networking).',['Internet = network of networks','Interspace: future idea of a shared virtual space']],
[1,'Bandwidth & Data Rate','Data communication','Bandwidth is the range of frequencies a channel can carry (Hz). Data rate is how many bits are sent per second (bps). Throughput is the actual rate achieved.',['Units: bps, Kbps, Mbps, Gbps, Tbps','1 Byte = 8 bits; MBps is bytes per second'],'Higher bandwidth means higher possible data rate.'],
[1,'Channel & Switching','Data communication','A channel is the path that carries data. Circuit switching sets up a dedicated path first (old telephone). Packet switching splits a message into packets that travel independently and are reassembled.',['Packet = header + payload','Internet uses packet switching']],
[1,'IP Address','Addressing','A unique number for each device on a network. IPv4 is 32 bits (like 192.168.1.1), IPv6 is 128 bits (hexadecimal). It identifies the device and its network location.',['IPv4 gives about 4.3 billion addresses','Can be static or dynamic']],
[1,'MAC Address','Addressing','A 48-bit hardware address fixed in the NIC by the maker, written as 6 hex pairs (e.g. 3C:52:82:15:4A:B1). First half is the manufacturer ID.',['Physical address, works inside a LAN']],
[1,'NIC (Network Interface Card)','Addressing','The hardware that lets a device join a network. It has the MAC address and can be wired (Ethernet) or wireless (Wi-Fi card).'],
[1,'Twisted Pair Cable','Wired media','Two insulated copper wires twisted together to cut interference. UTP (unshielded) is cheap and used in LANs; STP is shielded.',['Speed: up to 1 Gbps or more','Range about 100 m','RJ-45 connector']],
[1,'Coaxial Cable','Wired media','A copper core with insulation, a metal shield and an outer jacket. Used in cable TV and older bus LANs.',['Better shielding than twisted pair','Less flexible and costlier']],
[1,'Optical Fibre','Wired media','Sends data as light pulses through glass or plastic strands. Fastest and safest wired medium, immune to electromagnetic noise.',['Very high bandwidth, long distance','Costly to install and repair','Core + cladding + coating']],
[1,'Radio, Microwave, Infrared, Satellite','Wireless media','Radio waves pass through walls and travel in all directions (FM, Wi-Fi). Microwave needs line of sight with towers. Infrared is short range (remote). Satellite covers huge areas through uplink and downlink.',['Bluetooth: short-range radio, about 10 m','Wi-Fi: LAN using radio waves']],
[1,'Modem','Network devices','Modulator + demodulator. Converts digital signals to analog and back so data can travel over telephone or cable lines.','Modem = Digital to Analog and Analog to Digital.'],
[1,'Hub','Network devices','A simple device with many ports. It broadcasts incoming data to all connected ports. No intelligence, creates collisions.'],
[1,'Switch','Network devices','Smarter than a hub. It reads the MAC address and sends the frame only to the right port, so it is faster and more secure.'],
[1,'Repeater','Network devices','Receives a weak signal, regenerates it and retransmits it so it can travel farther. Works at the physical layer.'],
[1,'Router','Network devices','Connects different networks and chooses the best path for packets using IP addresses and a routing table. Your home router links your LAN to the ISP.'],
[1,'Gateway','Network devices','Connects networks that use different protocols by translating between them. It is the entry and exit point of a network.'],
[1,'Access Point (AP)','Network devices','Lets wireless devices connect to a wired network through Wi-Fi.'],
[2,'Bus Topology','Topologies','All nodes share one backbone cable. Cheap and easy, but a cable fault stops everything and traffic is slow.',['Terminators at both ends']],
[2,'Star Topology','Topologies','Every node connects to a central hub or switch. Easy to add nodes and find faults, but the centre is a single point of failure.',['Most common in LANs']],
[2,'Ring Topology','Topologies','Nodes form a closed loop. Data travels in one direction, passing through each node. One break can stop the ring.'],
[2,'Mesh Topology','Topologies','Every node links to every other. Very reliable and fast but costly. Links needed = n(n-1)/2.','4 nodes = 6 links.'],
[2,'Tree Topology','Topologies','Hierarchy of star networks joined to a bus backbone. Good for big organisations; failure at the root splits the network.'],
[2,'PAN, LAN, MAN, WAN','Network types','PAN: a person\'s own devices (about 10 m). LAN: a room, building or campus (up to a few km). MAN: a city. WAN: countries or the world, like the Internet.',['LAN is fastest and private','WAN is slowest and often public']],
[2,'Internet, Intranet, Extranet','Network types','Internet is the public global network. Intranet is a private network of one organisation. Extranet shares part of an intranet with trusted outsiders.'],
[2,'HTTP and HTTPS','Protocols','HTTP transfers web pages between browser and server. HTTPS adds SSL/TLS encryption to keep data secure.',['Port 80 for HTTP, 443 for HTTPS']],
[2,'TCP/IP','Protocols','TCP breaks data into packets, numbers them and ensures reliable delivery. IP addresses and routes packets. Together they power the Internet.'],
[2,'FTP, SMTP, POP3, IMAP','Protocols','FTP uploads and downloads files. SMTP sends email. POP3 downloads email to one device. IMAP keeps email on the server for many devices.'],
[2,'Telnet, SSH, PPP, VoIP','Protocols','Telnet is remote login (not secure). SSH is the secure version. PPP links two nodes over a dial-up or serial line. VoIP carries voice calls over the Internet.'],
[2,'WWW, URL, Domain Name','Web services','WWW is a collection of linked web pages. A URL is the full address (protocol + domain + path). DNS converts a domain name like cbse.gov.in into an IP address.',['Example: https://www.cbse.gov.in/index.html']],
[2,'Browser & Web Server','Web services','A browser (Chrome, Firefox) requests and displays pages. A web server (Apache, Nginx) stores sites and answers requests.'],
[2,'HTML and XML','Web services','HTML is the markup language that structures web pages with predefined tags. XML stores and transports data with user-defined tags.'],
[2,'Cookies, Firewall, Hosting','Web services','A cookie is a small file a site saves in your browser (login, preferences). A firewall filters traffic to block threats. Web hosting rents server space for your website.'],
[2,'Web 2.0 & Social Web','Web services','Interactive web where users create content: blogs, wikis, social media, video sharing.']
];
const notes=[
['Data communication in 60 seconds',0,['Sender sends a message through a medium to a receiver following a protocol.','Five parts: message, sender, receiver, transmission medium, protocol.','Modes: Simplex (one way, TV), Half-duplex (both ways, one at a time, walkie-talkie), Full-duplex (both ways together, phone).','Data is sent as packets; each carries source and destination address.']],
['Units to remember',3,['1 Byte = 8 bits, 1 KB = 1024 B, 1 MB = 1024 KB, 1 GB = 1024 MB, 1 TB = 1024 GB.','Speed units: 1 Kbps = 1000 bps, 1 Mbps = 1000 Kbps, 1 Gbps = 1000 Mbps.','Time = data size / data rate.']],
['Wired vs wireless in short',2,['Guided (wired): twisted pair, coaxial, fibre. Signal follows a cable.','Unguided (wireless): radio, microwave, infrared, satellite. Signal travels through air or space.','Choose by cost, speed, distance and interference.']],
['Choosing a topology',1,['Small office: Star. Cheapest: Bus. Most reliable: Mesh.','Large campus: Tree (hierarchical).','Nodes fail? Star loses one node, bus and ring may lose everything.']],
['Network security basics',4,['Firewall filters incoming and outgoing traffic.','Cookies store small user info; they can be a privacy risk.','Threats: virus, worm, trojan, spyware, phishing, DoS attack, eavesdropping.','Use HTTPS, strong passwords and updates.']],
['How a web page loads',5,['1. You type a URL. 2. DNS finds the IP address. 3. Browser sends an HTTP request. 4. Web server replies with HTML. 5. Browser renders the page.','Static page: fixed content. Dynamic page: built on the fly from a database.']],
['Exam tips',0,['Draw the topology diagram and name one advantage and one disadvantage.','Always expand acronyms in full the first time.','For "differentiate" questions, use a two-column table with at least 3 points.']]
];
const diffs=[
['Hub vs Switch',['Hub','Switch'],[['Intelligence','Dumb, no filtering','Reads MAC addresses'],['Transmission','Broadcasts to all ports','Sends only to destination port'],['Speed','Slower, collisions','Faster, fewer collisions'],['Cost','Cheaper','Costlier'],['Mode','Half duplex','Full duplex']]],
['Switch vs Router',['Switch','Router'],[['Connects','Devices in one network','Different networks'],['Uses','MAC address','IP address'],['Job','Forwards frames','Finds best path for packets'],['Layer','Data link','Network']]],
['Repeater vs Bridge vs Gateway',['Repeater','Bridge','Gateway'],[['Purpose','Boosts signal','Joins two LAN segments','Joins different protocols'],['Intelligence','None','Filters by MAC','Translates protocols'],['Layer','Physical','Data link','All layers']]],
['Bus vs Star vs Ring',['Bus','Star','Ring'],[['Layout','One backbone','Central hub','Closed loop'],['Fault','Cable break stops all','Hub failure stops all','One break may stop all'],['Cost','Lowest','Medium','Medium'],['Adding nodes','Easy','Easiest','Hard']]],
['LAN vs MAN vs WAN',['LAN','MAN','WAN'],[['Area','Building / campus','City','Country / world'],['Speed','Highest','Medium','Lowest'],['Owner','Private','Private or public','Mostly public'],['Cost','Low','Medium','High'],['Example','School lab','Cable TV network','Internet']]],
['Guided vs Unguided media',['Guided (wired)','Unguided (wireless)'],[['Path','Physical cable','Air or space'],['Security','Better','Easier to intercept'],['Mobility','Fixed','Free movement'],['Examples','UTP, coaxial, fibre','Radio, microwave, satellite']]],
['Twisted pair vs Coaxial vs Fibre',['Twisted pair','Coaxial','Optical fibre'],[['Signal','Electrical','Electrical','Light'],['Speed','Moderate','High','Very high'],['Interference','Prone','Less','Immune'],['Cost','Lowest','Medium','Highest']]],
['Circuit vs Packet switching',['Circuit','Packet'],[['Path','Dedicated before sending','No fixed path'],['Delay','Setup delay, then steady','Variable'],['Efficiency','Wasteful when idle','Shares bandwidth well'],['Example','Telephone','Internet']]],
['POP3 vs IMAP',['POP3','IMAP'],[['Mail stored','Downloaded, removed from server','Kept on server'],['Devices','Best for one','Many devices sync'],['Internet needed','Only to download','Always']]],
['HTTP vs HTTPS',['HTTP','HTTPS'],[['Security','Plain text','Encrypted (SSL/TLS)'],['Port','80','443'],['Use','Normal pages','Banking, login']]],
['IPv4 vs IPv6',['IPv4','IPv6'],[['Size','32 bits','128 bits'],['Format','Decimal, dots','Hexadecimal, colons'],['Addresses','About 4.3 billion','Practically unlimited']]],
['IP vs MAC address',['IP address','MAC address'],[['Type','Logical','Physical'],['Size','32 or 128 bits','48 bits'],['Changes?','Yes, with network','No, fixed in NIC']]],
['HTML vs XML',['HTML','XML'],[['Purpose','Display data','Store and transport data'],['Tags','Predefined','User-defined'],['Case','Not sensitive','Sensitive']]],
['Static vs Dynamic web page',['Static','Dynamic'],[['Content','Fixed','Changes with user or time'],['Database','Not needed','Usually used'],['Speed','Faster','Slower']]],
['Web browser vs Web server',['Browser','Server'],[['Role','Requests and shows pages','Stores and sends pages'],['Examples','Chrome, Firefox','Apache, Nginx'],['Side','Client','Host']]],
['Simplex vs Half vs Full duplex',['Simplex','Half duplex','Full duplex'],[['Direction','One way','Both, one at a time','Both together'],['Example','Radio, keyboard','Walkie-talkie','Phone call']]]
];
const acr=[['ARPANET','Advanced Research Projects Agency Network'],['NSFNET','National Science Foundation Network'],['LAN','Local Area Network'],['MAN','Metropolitan Area Network'],['WAN','Wide Area Network'],['PAN','Personal Area Network'],['NIC','Network Interface Card'],['MAC','Media Access Control'],['IP','Internet Protocol'],['TCP','Transmission Control Protocol'],['HTTP','HyperText Transfer Protocol'],['HTTPS','HyperText Transfer Protocol Secure'],['FTP','File Transfer Protocol'],['SMTP','Simple Mail Transfer Protocol'],['POP3','Post Office Protocol version 3'],['IMAP','Internet Message Access Protocol'],['PPP','Point-to-Point Protocol'],['VoIP','Voice over Internet Protocol'],['SSH','Secure Shell'],['SSL','Secure Sockets Layer'],['TLS','Transport Layer Security'],['DNS','Domain Name System'],['URL','Uniform Resource Locator'],['WWW','World Wide Web'],['HTML','HyperText Markup Language'],['XML','eXtensible Markup Language'],['UTP','Unshielded Twisted Pair'],['STP','Shielded Twisted Pair'],['RJ-45','Registered Jack 45'],['Wi-Fi','Wireless Fidelity'],['ISP','Internet Service Provider'],['AP','Access Point'],['bps','bits per second'],['Modem','Modulator-Demodulator'],['DoS','Denial of Service'],['DDoS','Distributed Denial of Service'],['VPN','Virtual Private Network'],['IPv4 / IPv6','Internet Protocol version 4 / 6'],['P2P','Peer to Peer'],['UDP','User Datagram Protocol'],['ICT','Information and Communication Technology'],['GSM','Global System for Mobile Communication'],['SIM','Subscriber Identity Module'],['NFC','Near Field Communication'],['IoT','Internet of Things'],['CSMA/CD','Carrier Sense Multiple Access / Collision Detection']];
const tabs=['Components','Short notes','Differences','Acronyms'];
const $=s=>document.querySelector(s);
const nav=$('#nav');
tabs.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.style.background=COL[i];b.onclick=()=>show(i);nav.appendChild(b)});
function show(i){document.querySelectorAll('.sec').forEach((s,j)=>s.classList.toggle('on',i===j));[...nav.children].forEach((b,j)=>b.classList.toggle('on',i===j));window.scrollTo({top:0})}
// components
let flt='all';
(function(){
const s=$('#s0');
s.innerHTML='<p class="tip">Tap a card to open it. Filter by chapter or group.</p><div class="row" id="f"></div><div class="grid" id="g"></div>';
const groups=[...new Set(comps.map(c=>c[2]))];
const fs=[['all','All'],['1','Chapter 1'],['2','Chapter 2'],...groups.map(g=>[g,g])];
fs.forEach(([k,l])=>{const b=document.createElement('button');b.className='chip'+(k==='all'?' on':'');b.textContent=l;b.onclick=()=>{flt=k;document.querySelectorAll('#f .chip').forEach(x=>x.classList.toggle('on',x===b));draw()};$('#f').appendChild(b)});
const gi=g=>groups.indexOf(g)%COL.length;
window.draw=function(){const g=$('#g');g.innerHTML='';comps.filter(c=>flt==='all'||String(c[0])===flt||c[2]===flt).forEach(c=>{
const d=document.createElement('div');d.className='card';d.style.setProperty('--c',COL[gi(c[2])]);
d.innerHTML=`<button class="q" aria-expanded="false"><span>${c[1]}</span><span class="t">Ch ${c[0]}</span></button><div class="body"><p style="margin:0"><b>${c[2]}.</b> ${c[3]}</p>${c[4]&&Array.isArray(c[4])?'<ul>'+c[4].map(x=>'<li>'+x+'</li>').join('')+'</ul>':''}${(c[5]||(!Array.isArray(c[4])&&c[4]))?'<div class="key">'+(c[5]||c[4])+'</div>':''}</div>`;
const q=d.querySelector('.q');q.onclick=()=>{const o=d.classList.toggle('open');q.setAttribute('aria-expanded',o)};g.appendChild(d)})};
draw();
})();
// notes
$('#s1').innerHTML=notes.map(n=>`<div class="note" style="--c:${COL[n[1]]}"><h3>${n[0]}</h3><ul>${n[2].map(x=>'<li>'+x+'</li>').join('')}</ul></div>`).join('');
// differences
(function(){
const s=$('#s2');s.innerHTML='<p class="tip">Pick a pair to see the comparison table.</p><div class="row" id="dp"></div><div id="dt"></div>';
function put(i){const d=diffs[i],c=COL[i%COL.length];document.querySelectorAll('#dp .chip').forEach((x,j)=>x.classList.toggle('on',j===i));
$('#dt').innerHTML=`<div class="tbl" style="--c:${c}"><table><thead><tr><th>${d[0]}</th>${d[1].map(h=>'<th>'+h+'</th>').join('')}</tr></thead><tbody>${d[2].map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`}
diffs.forEach((d,i)=>{const b=document.createElement('button');b.className='chip';b.textContent=d[0];b.onclick=()=>put(i);$('#dp').appendChild(b)});put(0);
})();
// acronyms
(function(){
const s=$('#s3');
s.innerHTML='<div class="srch"><input id="si" placeholder="Search an acronym or meaning" aria-label="Search acronyms"><button class="chip" id="qz" aria-pressed="false">Quiz mode: hide meanings</button></div><p class="tip" id="ct"></p><div class="ag" id="ag"></div>';
let quiz=false;
function r(){const v=$('#si').value.toLowerCase();const l=acr.filter(a=>(a[0]+a[1]).toLowerCase().includes(v));$('#ct').textContent=l.length+' of '+acr.length+' acronyms'+(quiz?'. Tap a card to reveal.':'');
$('#ag').className='ag'+(quiz?' hide':'');$('#ag').innerHTML='';
l.forEach(a=>{const b=document.createElement('button');b.className='ac';b.style.setProperty('--c',COL[acr.indexOf(a)%COL.length]);b.innerHTML='<b>'+a[0]+'</b><span>'+a[1]+'</span>';b.onclick=()=>b.classList.toggle('show');$('#ag').appendChild(b)})}
$('#si').oninput=r;$('#qz').onclick=e=>{quiz=!quiz;e.target.classList.toggle('on',quiz);e.target.setAttribute('aria-pressed',quiz);r()};r();
})();
$('#th').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#17163a';r.dataset.theme=d?'light':'dark'};
show(0);
</script>
</body>
</html>
